name: Construir APK Android (Capacitor)

on:
  push:
    branches: [main, master, 'feat/*']
    paths:
      - 'www/**'
      - 'src/**'
      - 'scripts/**'
      - 'vite.config.mjs'
      - 'tailwind.config.cjs'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gerar APK de depuração
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar código-fonte
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Testar autenticação e catálogo
        run: npm test

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar cache e validar Gradle Wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Compilar frontend Vite
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "Configure VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY em Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          npm run build

      - name: Sincronizar Capacitor com Android
        run: npx --no-install cap sync android

      - name: Permitir execução do Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK de depuração
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Validar APK e calcular SHA-256
        shell: bash
        run: |
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$apk" ]; then
            echo "APK não encontrado: $apk" >&2
            exit 1
          fi
          size=$(stat -c '%s' "$apk")
          if [ "$size" -le 0 ]; then
            echo "O APK foi gerado vazio." >&2
            exit 1
          fi
          sha256=$(sha256sum "$apk" | cut -d ' ' -f 1)
          {
            echo '### APK de depuração'
            echo
            echo "- Arquivo: \`$apk\`"
            echo "- Tamanho: $size bytes"
            echo "- SHA-256: \`$sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar APK para download
        uses: actions/upload-artifact@v7
        with:
          name: CineView-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          # archive:false makes upload-artifact use the filename as artifact name and ignore name.
          archive: true
