name: Construir APK Android (Capacitor)

on:
  push:
    branches: [main, master]
    paths:
      - 'www/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gerar APK de depuração
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar código-fonte
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar cache e validar Gradle Wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Sincronizar Capacitor com Android
        run: npx --no-install cap sync android

      - name: Permitir execução do Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK de depuração
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publicar APK para download
        uses: actions/upload-artifact@v7
        with:
          name: cineview-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
